body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);--destructive:oklch(0.577 0.245 27.325);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}

.ic12{width:12px;height:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit;flex-shrink:0}

.btn-sm{height:32px;padding:0 12px;gap:6px}
.btn-7{height:28px;padding:0 10px;gap:4px;font-size:12px}
.btn-i7{width:28px;height:28px;padding:0}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;border-radius:8.4px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.badge-pri{background:var(--primary);color:var(--primary-fg)}
.btn-pri{background:var(--primary);color:var(--primary-fg)}
.badge-secondary{background:var(--muted);color:oklch(0.21 0.006 285.885)}
.pill{display:inline-flex;align-items:center;border-radius:9999px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.tab{height:28px;padding:0 10px;border:0;border-radius:8.4px;background:transparent;color:var(--muted-fg);font-family:inherit;font-size:12px;line-height:16px;font-weight:500;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--muted);color:var(--fg)}
.li{display:flex;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center}
.dot{margin-top:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9999px;background:var(--muted);flex-shrink:0}
.line{flex:1;width:1px;background:var(--border);margin-top:4px}
.card{flex:1;min-width:0;padding-bottom:16px}
.card-in{border:1px solid var(--border);border-radius:10.4px;background:var(--bg);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
.card-h-b{border-bottom:1px solid var(--border);background:oklch(0.967 0.001 286.375 / .3)}

.ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;font-size:14px;font-weight:500;line-height:1.25}
.by{margin-left:6px;font-size:12px;font-weight:400;color:var(--muted-fg)}
.when{font-size:12px;line-height:16px;color:var(--muted-fg);white-space:nowrap;flex-shrink:0}
</style>
