<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width:256px;height:{{height}}px;box-sizing:border-box;display:flex;flex-direction:column;background:oklch(0.30 0.006 285.885);color:oklch(0.985 0 0);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased">

  <!-- Team switcher -->
  <div style="padding:8px;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:8px;height:48px;padding:8px;border-radius:8.4px;box-sizing:border-box">
      <div style="width:32px;height:32px;border-radius:9999px;background:#2563eb;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0">E1</div>
      <div style="display:grid;flex:1;min-width:0;line-height:1.25">
        <span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Every1Drives</span>
        <span style="font-size:12px;color:oklch(0.552 0.016 285.938)">admin</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
    </div>
  </div>

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden">

    <!-- Navigation group -->
    <div style="padding:8px">
      <div style="height:32px;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:500;color:oklch(0.985 0 0 / 0.7)">Navigation</div>
      <div style="display:flex;flex-direction:column;gap:4px">

        <a href="#dashboard" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.dashboard}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </a>

        <div>
          <a href="#inbox" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.inbox}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            <span>Inbox</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-left:auto;{{inboxChevron}}"><path d="m9 18 6-6-6-6"/></svg>
          </a>
          <sc-if value="{{inboxOpen}}" hint-placeholder-val="{{ true }}">
            <div style="margin:0 14px;padding:2px 10px;border-left:1px solid oklch(0.37 0.006 285.885);display:flex;flex-direction:column;gap:4px">
              <a href="#inbox-list" style="display:flex;align-items:center;height:28px;padding:0 8px;border-radius:8.4px;color:oklch(0.985 0 0);text-decoration:none;background:oklch(0.37 0.006 285.885);font-weight:500">Inbox</a>
              <a href="#inbox-done" style="display:flex;align-items:center;height:28px;padding:0 8px;border-radius:8.4px;color:oklch(0.985 0 0);text-decoration:none">Done</a>
              <a href="#inbox-future" style="display:flex;align-items:center;height:28px;padding:0 8px;border-radius:8.4px;color:oklch(0.985 0 0);text-decoration:none">Future</a>
            </div>
          </sc-if>
        </div>

        <a href="#opportunities" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.opportunities}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></svg>
          <span>Opportunities</span>
        </a>

        <a href="#leads" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.leads}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
          <span>Leads</span>
        </a>

        <a href="#clients" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.clients}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Contacts</span>
        </a>

        <a href="#inventory" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.inventory}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
          <span>Inventory</span>
        </a>

      </div>
    </div>

    <div style="height:1px;margin:0;background:oklch(0.967 0.001 286.375)"></div>

    <!-- Smart Views group -->
    <div style="padding:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px">
        <span style="font-size:11px;line-height:16px;font-weight:500;letter-spacing:0.025em;text-transform:uppercase;color:oklch(0.985 0 0 / 0.7)">Smart Views</span>
        <div style="display:flex;align-items:center;gap:2px">
          <button type="button" aria-label="Manage Smart Views" style="display:flex;width:20px;height:20px;padding:0;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:oklch(0.985 0 0 / 0.5);cursor:pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          </button>
          <button type="button" aria-label="Search smart views" style="display:flex;width:20px;height:20px;padding:0;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;color:oklch(0.985 0 0 / 0.5);cursor:pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{smartViews}}" as="sv" hint-placeholder-count="4">
          <a href="#smart-view" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;font-size:12px;line-height:16px;{{sv.on}}">{{sv.name}}</a>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="height:1px;background:oklch(0.967 0.001 286.375);margin:8px 0;flex-shrink:0"></div>

  <!-- Footer: Operations + user -->
  <div style="padding:8px;display:flex;flex-direction:column;gap:8px;flex-shrink:0">

    <div>
      <div style="height:32px;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:500;color:oklch(0.985 0 0 / 0.7)">Operations</div>
      <div style="display:flex;flex-direction:column;gap:4px">

        <a href="#health" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.health}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
          <span>Health</span>
          <span style="margin-left:auto;width:20px;height:20px;border-radius:9999px;background:oklch(0.577 0.245 27.325);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center">3</span>
        </a>

        <a href="#settings" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.settings}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
          <span>Settings</span>
        </a>

        <a href="#reports" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.reports}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span>Reports</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
        </a>

        <a href="#followups" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.followups}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></svg>
          <span>Follow-ups</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
        </a>

        <a href="#about" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8.4px;box-sizing:border-box;color:oklch(0.985 0 0);text-decoration:none;{{st.about}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span>About</span>
        </a>

      </div>
    </div>

    <div style="height:1px;background:oklch(0.967 0.001 286.375)"></div>

    <!-- User -->
    <div style="display:flex;align-items:center;gap:8px;height:48px;padding:8px;border-radius:8.4px;box-sizing:border-box">
      <div style="width:32px;height:32px;border-radius:8.4px;background:oklch(0.967 0.001 286.375);color:oklch(0.141 0.005 285.823);display:flex;align-items:center;justify-content:center;flex-shrink:0">J</div>
      <div style="display:grid;flex:1;min-width:0;line-height:1.25">
        <span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Jordan Blake</span>
        <span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">jordan.blake@example.com</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","inbox","opportunities","leads","clients","inventory","health","settings","reports","followups","about"],"default":"inbox"},"view":{"editor":"text","default":""},"height":{"editor":"int","default":960,"min":600,"max":4000},"$preview":{"width":256,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'inbox';
    const on = 'background:oklch(0.37 0.006 285.885);font-weight:500;';
    const pick = (k) => (a === k ? on : '');
    return {
      st: {
        dashboard: pick('dashboard'),
        inbox: pick('inbox'),
        opportunities: pick('opportunities'),
        leads: pick('leads'),
        clients: pick('clients'),
        inventory: pick('inventory'),
        health: pick('health'),
        settings: pick('settings'),
        reports: pick('reports'),
        followups: pick('followups'),
        about: pick('about'),
      },
      height: this.props.height ?? 960,
      inboxOpen: a === 'inbox',
      inboxChevron: a === 'inbox' ? 'transform:rotate(90deg)' : '',
      smartViews: ['New Leads', 'Credit Apps Pending', 'Test Drives This Week', 'Trade-in Quotes'].map((name) => ({
        name,
        on: this.props.view === name ? on : '',
      })),
    };
  }
}
</script>
</body>
</html>
