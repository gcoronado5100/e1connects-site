<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New email dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);--destructive:oklch(0.577 0.245 27.325);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit}
.btn-outline{background:var(--bg);border-color:var(--border);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.lab{font-size:14px;line-height:14px;font-weight:500}
.fld{display:flex;flex-direction:column;gap:4px}
.inp{height:36px;width:100%;border:1px solid var(--border);border-radius:8.4px;background:transparent;padding:4px 12px;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
</style>
</helmet>
<div class="app" style="width:760px;height:720px;display:flex;align-items:center;justify-content:center;background:oklch(0.99 0 0 / .8)">

  <!-- EmailComposer: "New email", one connected mailbox -->
  <div role="dialog" aria-label="New email" style="position:relative;width:672px;display:grid;gap:16px;padding:24px;border:1px solid var(--border);border-radius:10.4px;background:var(--bg);box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)">
    <button type="button" aria-label="Close" style="position:absolute;right:16px;top:16px;width:16px;height:16px;padding:0;border:0;background:transparent;opacity:.7;cursor:pointer;color:var(--fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>

    <div style="display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0;font-size:18px;line-height:1;font-weight:600;letter-spacing:-.025em">New email</h2>
      <p style="margin:0;font-size:14px;color:var(--muted-fg)">It is sent from your own mailbox and stays in its Sent folder.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="fld">
        <label class="lab" for="email-from">From</label>
        <p id="email-from" style="margin:0;font-size:14px;color:var(--muted-fg)">jordan.blake@example.com</p>
      </div>

      <div class="fld">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <label class="lab" for="email-to">To</label>
          <button type="button" style="border:0;background:transparent;padding:0;font-family:inherit;font-size:12px;line-height:16px;color:var(--primary);cursor:pointer">Add Cc / Bcc</button>
        </div>
        <input id="email-to" class="inp" value="marcus.ellery@example.com" placeholder="name@example.com" autocomplete="off">
        <p style="margin:0;font-size:11px;line-height:16px;color:var(--muted-fg)">Separate several addresses with commas.</p>
      </div>

      <div class="fld">
        <label class="lab" for="email-subject">Subject</label>
        <input id="email-subject" class="inp" value="Your 2021 Civic Sport — financing options">
      </div>

      <div class="fld">
        <label class="lab" for="email-body">Message</label>
        <textarea id="email-body" rows="10" style="display:flex;min-height:80px;width:100%;resize:none;border:1px solid var(--border);border-radius:8.4px;background:var(--bg);padding:8px 12px;font-family:inherit;font-size:14px;line-height:20px;color:var(--fg)">Hi Marcus,

Thanks for your interest in the 2021 Civic Sport. With $2,000 down, the 60-month option comes to about $350 a month, in line with the budget you gave us.

Would you like to come by this week for a test drive? Bring your current car and we will look at the trade-in at the same time.

Jordan Blake</textarea>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button type="button" class="btn btn-outline">Cancel</button>
      <button type="button" class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>Send</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
