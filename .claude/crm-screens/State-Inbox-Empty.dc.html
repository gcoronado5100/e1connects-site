<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const ST = {
      'New Lead': '#3b82f6',
      'Contacted': '#f59e0b',
      'Credit App Sent': '#8b5cf6',
      'Test Drive Booked': '#10b981',
      'Trade-in Quote': '#f97316',
      'Follow Up': '#14b8a6',
    };
    const mk = (name, stage, tier, updated, dir, body, extra) => {
      const x = extra || {};
      return {
        name,
        initial: name.charAt(0),
        stage,
        hasStage: !!stage,
        noStage: !stage,
        stageStyle: stage ? 'background:' + ST[stage] + '22;color:' + ST[stage] : '',
        tierLabel: 'Tier ' + tier,
        hasTier: tier > 0,
        noTier: !(tier > 0),
        updated,
        dirLabel: dir === 'in' ? 'Them:' : 'You:',
        body,
        pending: !!x.pending,
        unreachable: !!x.unreachable,
      };
    };
    return {
      rows: [
        mk('Marcus Ellery', 'New Lead', 2, '4 minutes ago', 'in', 'Is the 2021 Civic still available?', { pending: true }),
        mk('Priya Nandakumar', 'Credit App Sent', 1, '12 minutes ago', 'out', 'Perfect, I just sent the credit application link to your phone.'),

        mk('Aaliyah Brooks', 'New Lead', 2, 'about 3 hours ago', 'out', 'Do you have a monthly budget in mind?', { unreachable: true }),
        mk('Tom Whitfield', 'Trade-in Quote', 4, 'about 5 hours ago', 'out', 'Could you send a few photos of your trade-in?'),
        mk('Wei Zhang', 'New Lead', 1, 'about 6 hours ago', 'out', 'Hi Wei, this is Chloe from Every1Drives. How can I help?'),
        mk('Rachel Gagnon', 'Contacted', 2, '1 day ago', 'in', "Thanks, I'll think about it"),
        mk('Omar Haddad', 'Follow Up', 3, '1 day ago', 'out', 'Just checking in. Still interested in the Silverado?'),
        mk('Hannah Lindqvist', 'Test Drive Booked', 1, '2 days ago', 'in', 'See you Thursday at 4!'),
        mk('Carlos Mendoza', 'New Lead', 5, '2 days ago', 'out', 'Hi Carlos, any questions about the Rogue?'),
      ],
    };
  }
}
</script>
