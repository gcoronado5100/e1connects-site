<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filter drawer · categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit}
.btn-outline{background:var(--bg);border-color:var(--border);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.cat{display:block;width:100%;height:40px;padding:0 16px;border:0;background:transparent;text-align:left;font-family:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.cat-hover{background:var(--muted)}
</style>
</helmet>
<aside class="app" style="width:448px;height:960px;display:flex;flex-direction:column;border-left:1px solid var(--border);box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);position:relative">

  <div style="padding:16px;border-bottom:1px solid var(--border)">
    <h2 style="margin:0;font-size:16px;line-height:24px;font-weight:600">Filters</h2>
  </div>
  <button type="button" aria-label="Close" style="position:absolute;top:16px;right:16px;width:20px;height:20px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:transparent;opacity:.7;cursor:pointer;color:var(--fg)">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>

  <div style="flex:1;min-height:0;overflow:hidden">
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column">
      <li><button type="button" class="cat cat-hover">Leads</button></li>
      <li><button type="button" class="cat">Communication</button></li>
      <li><button type="button" class="cat">SMS</button></li>
      <li><button type="button" class="cat">Contacts</button></li>
      <li><button type="button" class="cat">Addresses</button></li>
      <li><button type="button" class="cat">Vehicle</button></li>
      <li><button type="button" class="cat">Opportunities</button></li>
    </ul>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:8px;padding:16px;border-top:1px solid var(--border)">
    <button type="button" class="btn btn-outline">Cancel</button>
    <button type="button" class="btn btn-primary">Done</button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":448,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
