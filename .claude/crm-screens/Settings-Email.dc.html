<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · Email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);--destructive:oklch(0.577 0.245 27.325);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit;flex-shrink:0}
.btn-outline{background:var(--bg);border-color:var(--border);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.btn-sm{height:32px;padding:0 12px;gap:6px}
.card{display:flex;flex-direction:column;gap:24px;border:1px solid var(--border);border-radius:14.4px;padding:24px 0;background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.card-h{display:grid;gap:6px;padding:0 24px}
.card-t{font-weight:600;line-height:1}
.card-d{margin:0;font-size:14px;color:var(--muted-fg)}
.card-b{padding:0 24px;display:flex;flex-direction:column;gap:16px}
</style>
</helmet>
<div class="app" style="position:relative;width:1440px;height:900px;display:flex;overflow:hidden">

  <div style="width:256px;flex-shrink:0">
    <dc-import name="Sidebar" active="settings" height="900" hint-size="256px,900px"></dc-import>
  </div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="margin-bottom:16px;flex-shrink:0">
      <dc-import name="AppHeader" parent="Settings" current="Email" hint-size="1184px,64px"></dc-import>
    </div>

    <main style="flex:1;min-height:0;padding:0 16px;display:flex;overflow:hidden">
      <dc-import name="Settings-Nav" active="email" email="{{true}}" height="820" hint-size="224px,820px"></dc-import>

      <div style="flex:1;min-width:0;padding:24px;overflow:hidden">

        <!-- Connected accounts (SettingsEmailTab) -->
        <div class="card">
          <div class="card-h"><div class="card-t">Connected accounts</div><p class="card-d">Connect your mailbox to send and receive customer email from the CRM.</p></div>
          <div class="card-b">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid var(--border);border-radius:8.4px;padding:8px 12px">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;color:var(--muted-fg)"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
              <div style="min-width:0;flex:1">
                <p style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500">jordan.blake@example.com</p>
                <p style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px;color:var(--muted-fg)">Jordan Blake · Google</p>
              </div>
              <button type="button" class="btn btn-sm" title="Disconnect"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 5 3-3"/><path d="m2 22 3-3"/><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/></svg>Disconnect</button>
            </div>

            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px">
              <div style="display:flex;align-items:center;gap:8px">
                <button type="button" class="btn btn-outline"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>Connect with Google…</button>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:14px;color:var(--muted-fg)">or</span>
                <button type="button" class="btn btn-outline"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>Connect with Microsoft…</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
