<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · SMS Templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);--destructive:oklch(0.577 0.245 27.325);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic14{width:14px;height:14px}
.ic10{width:10px;height:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit;flex-shrink:0}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:0;border-radius:8.4px;background:transparent;color:var(--fg);cursor:pointer}
.inp{height:36px;width:100%;border:1px solid var(--border);border-radius:8.4px;background:transparent;padding:4px 12px;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.trig{display:flex;align-items:center;justify-content:space-between;height:36px;width:144px;padding:0 12px;border:1px solid var(--border);border-radius:8.4px;background:transparent;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.tcard{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:14.4px;padding:16px;background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.bdg{display:inline-flex;align-items:center;gap:2px;border:1px solid transparent;border-radius:8.4px;height:16px;padding:0 6px;font-size:10px;font-weight:500;white-space:nowrap}
</style>
</helmet>
<div class="app" style="position:relative;width:1440px;height:960px;display:flex;overflow:hidden">

  <div style="width:256px;flex-shrink:0">
    <dc-import name="Sidebar" active="settings" hint-size="256px,960px"></dc-import>
  </div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="margin-bottom:16px;flex-shrink:0">
      <dc-import name="AppHeader" parent="Settings" current="SMS Templates" hint-size="1184px,64px"></dc-import>
    </div>

    <main style="flex:1;min-height:0;padding:0 16px;display:flex;overflow:hidden">
      <dc-import name="Settings-Nav" active="sms-templates" hint-size="224px,880px"></dc-import>

      <div style="flex:1;min-width:0;padding:24px;overflow:hidden">
        <div style="display:flex;flex-direction:column;gap:24px">

          <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <h3 style="margin:0;font-size:18px;line-height:28px;font-weight:600">SMS Templates</h3>
              <p style="margin:0;font-size:14px;color:var(--muted-fg)">Reusable SMS/MMS messages for agents and Chloe follow-ups.</p>
            </div>
            <button type="button" class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New Template</button>
          </div>

          <div style="display:flex;gap:8px">
            <input class="inp" type="search" placeholder="Search by title..." aria-label="Search by title" style="max-width:320px">
            <button type="button" class="trig"><span>All</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="opacity:.5"><path d="m6 9 6 6 6-6"/></svg></button>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{templates}}" as="t" hint-placeholder-count="4">
              <div class="tcard">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin-top:2px;color:var(--muted-fg)"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
                    <span style="font-size:14px;font-weight:500">{{t.title}}</span>
                    <span class="bdg" style="{{t.visStyle}}"><svg class="ic ic10" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.visIcon}}"/></svg>{{t.vis}}</span>
                    <sc-if value="{{t.hasMedia}}" hint-placeholder-val="{{ false }}"><span class="bdg" style="background:var(--muted);color:oklch(0.21 0.006 285.885)"><svg class="ic ic10" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>{{t.media}} media</span></sc-if>
                  </div>
                  <p style="margin:2px 0 0;font-size:12px;line-height:16px;color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{t.body}}</p>
                  <sc-if value="{{t.hasBy}}" hint-placeholder-val="{{ false }}"><p style="margin:2px 0 0;font-size:12px;line-height:16px;color:var(--muted-fg)">by {{t.by}}</p></sc-if>
                </div>
                <div style="display:flex;gap:4px;flex-shrink:0">
                  <button type="button" class="ib" aria-label="Preview" title="Preview"><svg class="ic ic14" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                  <sc-if value="{{t.mine}}" hint-placeholder-val="{{ true }}">
                    <button type="button" class="ib" aria-label="Edit"><svg class="ic ic14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button>
                    <button type="button" class="ib" aria-label="Delete" style="color:var(--destructive)"><svg class="ic ic14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H8c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                  </sc-if>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const GLOBE = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z';
    const LOCK = 'M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z M7 11V7a5 5 0 0 1 10 0v4';
    const mk = (title, body, pub, media, by, mine) => ({
      title,
      body,
      vis: pub ? 'Public' : 'Private',
      visIcon: pub ? GLOBE : LOCK,
      visStyle: pub ? 'background:oklch(0.623 0.214 259.815);color:oklch(0.97 0.014 254.604)' : 'border-color:oklch(0.92 0.004 286.32);color:oklch(0.141 0.005 285.823)',
      hasMedia: media > 0,
      media,
      hasBy: !mine,
      by: by || '',
      mine,
    });
    return {
      templates: [
        mk('Welcome message', 'Hi {{first_name}}! This is {{agent_name}} from Every1Drives. Thanks for your interest — are you looking to finance or pay cash?', true, 0, '', true),
        mk('Credit application link', 'Here is the secure link to start your credit application: {{credit_app_link}}. It only takes a few minutes.', true, 0, '', true),
        mk('Trade-in photo checklist', 'To appraise your trade-in, please send photos of the front, back, sides, interior and the odometer.', false, 0, '', true),
        mk('This week’s featured SUVs', 'Take a look at the SUVs we just added to the lot. Want me to book a test drive?', true, 3, 'Alex Rivera', false),
        mk('Message de bienvenue (FR)', 'Bonjour {{first_name}}! Je suis {{agent_name}} de Every1Drives. Cherchez-vous un financement ou un achat comptant?', true, 0, 'Alex Rivera', false),
      ],
    };
  }
}
</script>
</body>
</html>
