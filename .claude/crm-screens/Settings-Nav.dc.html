<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside style="width:224px;height:{{height}}px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:12px;border-right:1px solid oklch(0.92 0.004 286.32);background:oklch(0.967 0.001 286.375 / .3);color:oklch(0.141 0.005 285.823);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased">
  <div style="padding:4px 8px 8px">
    <p style="margin:0;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:oklch(0.552 0.016 285.938)">Settings</p>
  </div>
  <sc-for list="{{items}}" as="i" hint-placeholder-count="8">
    <button type="button" style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8.4px;text-align:left;font-family:inherit;font-size:14px;line-height:20px;cursor:pointer;{{i.style}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="{{i.icon}}"/></svg>
      {{i.label}}
    </button>
  </sc-for>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["account","voice","general","notifications","team","email","smart-views","states","pipeline-stages","phone-numbers","sms-providers","shortcuts","sms-templates","chloe-ai","follow-ups","follow-up-tiers","sites-connections","users"],"default":"smart-views"},"email":{"editor":"boolean","default":false},"height":{"editor":"int","default":880,"min":600,"max":4000},"$preview":{"width":224,"height":880}}'>

      );
    }
    return { height: this.props.height ?? 880, items: defs.map((d) => ({ label: d[1], icon: d[2], style: active === d[0] ? ON : OFF })) };
  }
}
</script>
</body>
</html>
