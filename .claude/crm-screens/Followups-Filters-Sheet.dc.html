<style>
body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);--destructive:oklch(0.577 0.245 27.325);--c1:oklch(0.646 0.222 41.116);--c2:oklch(0.6 0.118 184.704);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit;flex-shrink:0}
.btn-outline{background:var(--bg);border-color:var(--border);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.btn-sec{background:var(--muted);color:oklch(0.21 0.006 285.885)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-icon{width:32px;padding:0}
.card{display:flex;flex-direction:column;gap:24px;border:1px solid var(--border);border-radius:14.4px;padding:24px 0;background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0 / .05);min-width:0}
.card-h{display:grid;gap:6px;padding:0 24px}
.card-t{font-weight:600;line-height:1}
.card-d{margin:0;font-size:14px;color:var(--muted-fg)}
.card-b{padding:0 24px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
.trig{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8.4px;background:transparent;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05);white-space:nowrap}
.inp{height:32px;border:1px solid var(--border);border-radius:8.4px;background:transparent;padding:4px 12px;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.bdg{display:inline-flex;align-items:center;border:1px solid transparent;border-radius:8.4px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.bdg-def{background:var(--primary);color:var(--primary-fg)}
.bdg-sec{background:var(--muted);color:oklch(0.21 0.006 285.885)}
.bdg-dest{background:var(--destructive);color:#fff}
.av{position:relative;display:inline-flex;flex-shrink:0}
.av-c{display:flex;align-items:center;justify-content:center;border-radius:9999px;background:var(--muted);font-size:10px;line-height:16px;color:var(--fg)}
.pd{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:9999px;box-shadow:0 0 0 2px var(--bg)}
.pop{border:1px solid var(--border);border-radius:8.4px;background:oklch(0.99 0 0);box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1)}
.gr{display:grid;grid-template-columns:var(--cols);align-items:center}
.sr{border:0;padding:0;margin:0;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.bdg-out{background:transparent;border-color:var(--border);color:var(--fg)}
.h36{height:36px}
.btn-sm{height:32px}
.btn-def{height:36px;padding:0 16px}
.th-btn{display:inline-flex;align-items:center;gap:6px;height:32px;margin-left:-12px;padding:0 12px;border:0;border-radius:8.4px;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:inherit;white-space:nowrap}
.dt-h{display:flex;align-items:center;height:40px;padding:0 8px;font-weight:500;white-space:nowrap}
.dt-c{padding:8px;min-width:0;display:flex;align-items:center}
.lbl{font-size:14px;line-height:14px;font-weight:500}

</style>
</helmet>
<div class="app" style="position:relative;width:384px;height:520px;background:rgb(0 0 0 / .5);display:flex;justify-content:flex-end;overflow:hidden">
  <div role="dialog" aria-label="sheet" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;gap:16px;background:var(--bg);border-left:1px solid var(--border);box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);overflow:hidden">
    <button type="button" aria-label="Close" style="position:absolute;right:16px;top:16px;width:16px;height:16px;padding:0;border:0;background:transparent;opacity:.7;color:var(--fg);cursor:pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div style="padding:16px 16px 0"><div style="display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>Filters</div></div>
    <div style="margin-top:8px;padding:0 16px 24px;display:flex;flex-direction:column;gap:20px">
  <div style="display:grid;gap:6px"><span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:.025em;text-transform:uppercase;color:var(--muted-fg)">Status</span><button type="button" class="trig" style="width:100%;height:36px"><span style="display:flex;align-items:center;gap:8px;">Active only</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;opacity:.5"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div style="display:grid;gap:6px"><span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:.025em;text-transform:uppercase;color:var(--muted-fg)">Follow-ups</span><button type="button" class="trig" style="width:100%;height:36px"><span style="display:flex;align-items:center;gap:8px;">All follow-ups</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;opacity:.5"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div style="display:grid;gap:6px"><span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:.025em;text-transform:uppercase;color:var(--muted-fg)">Stage</span><button type="button" class="trig" style="width:100%;height:36px"><span style="display:flex;align-items:center;gap:8px;">Tier 2 — 24h</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;opacity:.5"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div style="display:grid;gap:6px"><span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:.025em;text-transform:uppercase;color:var(--muted-fg)">Scheduled</span><button type="button" class="btn btn-def" style="width:100%;height:32px;background:var(--primary);color:var(--primary-fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></svg>Showing scheduled only</button></div>
  <button type="button" class="btn btn-outline" style="width:100%;height:36px">Clear all filters</button>
</div>
  </div>
</div>
