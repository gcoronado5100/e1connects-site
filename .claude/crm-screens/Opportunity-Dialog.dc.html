<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opportunity dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:oklch(0.99 0 0);--fg:oklch(0.141 0.005 285.823);--muted:oklch(0.967 0.001 286.375);--muted-fg:oklch(0.552 0.016 285.938);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.623 0.214 259.815);--primary-fg:oklch(0.97 0.014 254.604);--destructive:oklch(0.577 0.245 27.325);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px;color:var(--fg);-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8.4px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;background:transparent;color:inherit}
.btn-outline{background:var(--bg);border-color:var(--border);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-destructive{background:var(--destructive);color:#fff;height:32px;padding:0 12px;gap:6px}
.lab{font-size:14px;line-height:14px;font-weight:500}
.fld{display:flex;flex-direction:column;gap:4px}
.inp{height:36px;width:100%;border:1px solid var(--border);border-radius:8.4px;background:transparent;padding:4px 12px;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.nsel{height:36px;width:100%;border:1px solid var(--border);border-radius:8.4px;background:var(--bg);padding:0 12px;font-family:inherit;font-size:14px;color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</helmet>
<div class="app" style="width:640px;height:840px;display:flex;align-items:center;justify-content:center;background:rgb(0 0 0 / .8)">

  <div role="dialog" aria-label="Edit Opportunity" style="position:relative;width:512px;display:grid;gap:16px;padding:24px;border:1px solid var(--border);border-radius:10.4px;background:var(--bg);box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)">
    <button type="button" aria-label="Close" style="position:absolute;right:16px;top:16px;width:16px;height:16px;padding:0;border:0;background:transparent;opacity:.7;cursor:pointer;color:var(--fg)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>

    <h2 style="margin:0;font-size:18px;line-height:1;font-weight:600;letter-spacing:-.025em">Edit Opportunity</h2>

    <div style="display:flex;flex-direction:column;gap:12px;padding:4px 0">
      <div class="fld"><label class="lab" for="o-title">Title *</label><input id="o-title" class="inp" value="2021 Honda Civic Sport" placeholder="e.g. Toyota Corolla purchase"></div>

      <div class="fld"><label class="lab" for="o-stage">Stage</label>
        <select id="o-stage" class="nsel"><option>— No stage —</option><option selected>New Lead</option><option>Contacted</option><option>Credit App Sent</option><option>+ New stage…</option></select>
      </div>

      <div class="g2">
        <div class="fld"><label class="lab" for="o-client">Client ID</label><input id="o-client" class="inp" type="number" value="1042"></div>
        <div class="fld"><label class="lab" for="o-lead">Lead ID</label><input id="o-lead" class="inp" type="number" value="12874"></div>
      </div>

      <div class="g2">
        <div class="fld"><label class="lab" for="o-value">Value ($)</label><input id="o-value" class="inp" type="number" value="24900.00" placeholder="0.00"></div>
        <div class="fld"><label class="lab" for="o-conf">Confidence (0–100)</label><input id="o-conf" class="inp" type="number" value="62"></div>
      </div>

      <div class="fld"><label class="lab" for="o-date">Close Date</label><input id="o-date" class="inp" type="date" value="2026-10-12"></div>

      <div class="fld"><label class="lab" for="o-user">Assigned User</label>
        <select id="o-user" class="nsel"><option>— Unassigned —</option><option selected>Jordan Blake</option><option>Alex Rivera</option></select>
      </div>

      <div class="fld"><label class="lab" for="o-notes">Notes</label>
        <textarea id="o-notes" rows="3" placeholder="Additional notes..." style="width:100%;resize:vertical;border:1px solid var(--border);border-radius:8.4px;background:transparent;padding:8px 12px;font-family:inherit;font-size:14px;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .05)">Wants financing. Trade-in is a 2014 Corolla. Test drive booked for Saturday.</textarea>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px">
      <button type="button" class="btn btn-destructive"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H8c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Delete</button>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn btn-outline">Cancel</button>
        <button type="button" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
